name: Update Filters

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 6am UTC
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      VERSION: placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Set version
        run: echo "VERSION=$(date -u +%Y.%m.%d)" >> "$GITHUB_ENV"

      - name: Download and compile filter lists
        run: npm run build:filters

      - name: Build and test
        run: |
          npm test
          npm run build:chrome

      - name: Package Chrome extension
        run: |
          cd .output/chrome-mv3
          zip -r "../../adblocky-chrome-v${{ env.VERSION }}.zip" .

      - name: Create release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "v${{ env.VERSION }}" -m "Daily filter list update — ${{ env.VERSION }}"
          git push origin "v${{ env.VERSION }}" --force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: adblocky-chrome-v${{ env.VERSION }}.zip
          body: "Daily filter list update — ${{ env.VERSION }}"
          draft: false
          prerelease: false
